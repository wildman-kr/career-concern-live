<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Concern Live</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      color: green;
    }
  </style>
</head>

<body>

  <h1>진로 고민 입력</h1>

  <p id="questionText"></p>

  <textarea id="response"></textarea>

  <button onclick="submitResponse()">제출</button>

  <div id="message"></div>

  <script>
  const supabaseUrl = 'https://jhvniiyolcxavyjlewfh.supabase.co';
  const supabaseKey = 'sb_publishable_ajdFyMp1gqAwWD0R6SAwFA_f1yA3FBj';

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  async function loadActiveQuestion() {
    const { data, error } = await client
      .from('questions')
      .select('*')
      .eq('is_active', true)
      .single();

    if (!error && data) {
      document.getElementById('questionText').innerText =
        data.question_text;

      window.activeQuestionId = data.id;
    }
  }

  async function submitResponse() {
    const responseText =
      document.getElementById('response').value.trim();

    if (!responseText) {
      document.getElementById('message').innerText =
        '응답을 입력해주세요.';
      return;
    }

    const { error } = await client
      .from('responses')
      .insert([
        {
          room_code: 'TEST101',
          response_text: responseText,
          question_id: window.activeQuestionId
        }
      ]);

    if (error) {
      document.getElementById('message').innerText =
        '오류 발생';
      console.error(error);
    } else {
      document.getElementById('message').innerText =
        '제출 완료!';
      document.getElementById('response').value = '';
    }
  }

  loadActiveQuestion();
    client
  .channel('student-questions-channel')
  .on(
    'postgres_changes',
    {
      event: 'UPDATE',
      schema: 'public',
      table: 'questions'
    },
    () => {
      loadActiveQuestion();
      document.getElementById('response').value = '';
      document.getElementById('message').innerText = '';
    }
  )
  .subscribe();
</script>

</body>
</html>
