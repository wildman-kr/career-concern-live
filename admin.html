<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Concern Live - 관리자</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      font-size: 18px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    .question-card {
      background: white;
      padding: 16px;
      margin-top: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .active {
      border: 3px solid #222;
    }

    .status {
      font-size: 14px;
      margin-top: 8px;
      color: green;
    }
  </style>
</head>

<body>
  <h1>관리자 화면</h1>

  <h2>질문 만들기</h2>
  <textarea id="questionText" placeholder="학생들에게 보여줄 질문을 입력하세요."></textarea>
  <br>
  <button onclick="createQuestion()">질문 추가</button>

  <h2>질문 목록</h2>
  <p>ON으로 선택한 질문이 학생 화면과 실시간 화면에 표시됩니다.</p>

  <div id="questions"></div>

  <script>
    const supabaseUrl = 'https://jhvniiyolcxavyjlewfh.supabase.co/';
    const supabaseKey = 'sb_publishable_ajdFyMp1gqAwWD0R6SAwFA_f1yA3FBj';

    const client = supabase.createClient(supabaseUrl, supabaseKey);

    async function createQuestion() {
      const questionText = document.getElementById('questionText').value.trim();

      if (!questionText) {
        alert('질문을 입력하세요.');
        return;
      }

      const { error } = await client
        .from('questions')
        .insert([
          {
            question_text: questionText,
            is_active: false
          }
        ]);

      if (error) {
        alert('질문 추가 오류');
        console.error(error);
      } else {
        document.getElementById('questionText').value = '';
        loadQuestions();
      }
    }

    async function loadQuestions() {
      const { data, error } = await client
        .from('questions')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      const container = document.getElementById('questions');
      container.innerHTML = '';

      data.forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card' + (q.is_active ? ' active' : '');

        card.innerHTML = `
          <div style="font-size:20px; line-height:1.5;">${q.question_text}</div>
          <div class="status">${q.is_active ? '현재 ON' : 'OFF'}</div>
          <button onclick="activateQuestion(${q.id})">이 질문 ON</button>
        `;

        container.appendChild(card);
      });
    }

    async function activateQuestion(questionId) {
      await client
        .from('questions')
        .update({ is_active: false })
        .neq('id', questionId);

      const { error } = await client
        .from('questions')
        .update({ is_active: true })
        .eq('id', questionId);

      if (error) {
        alert('ON 설정 오류');
        console.error(error);
      } else {
        loadQuestions();
      }
    }

    loadQuestions();
  </script>
</body>
</html>
