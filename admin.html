<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Concern Live - 관리자</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      font-size: 18px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      margin-right: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .danger {
      background: #dc2626;
      color: white;
      border: none;
    }

    .warning {
      background: #f97316;
      color: white;
      border: none;
    }

    .primary {
      background: #111827;
      color: white;
      border: none;
    }

    .question-card {
      background: white;
      padding: 16px;
      margin-top: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .active {
      border: 3px solid #222;
    }

    .status {
      font-size: 14px;
      margin-top: 8px;
      margin-bottom: 8px;
      color: green;
      font-weight: bold;
    }

    .question-text {
      font-size: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="loginScreen">
    <h1>관리자 로그인</h1>

    <input
      type="password"
      id="passwordInput"
      placeholder="비밀번호 입력"
      style="
        padding:12px;
        font-size:18px;
        width:300px;
      "
    />

    <br><br>

    <button onclick="checkPassword()">
      로그인
    </button>

    <p id="loginMessage" style="color:red;"></p>
  </div>

  <div id="adminContent" style="display:none;">

    <h1>관리자 화면</h1>

    <button class="danger" onclick="deleteActiveQuestionResponses()">
      현재 ON 질문 응답 전체 삭제
    </button>

    <h2>질문 만들기</h2>

    <textarea
      id="questionText"
      placeholder="학생들에게 보여줄 질문을 입력하세요."
    ></textarea>

    <br>

    <button class="primary" onclick="createQuestion()">
      질문 추가
    </button>

    <h2>질문 목록</h2>

    <p>
      ON으로 선택한 질문이 학생 화면과 실시간 화면에 표시됩니다.
    </p>

    <div id="questions"></div>

  </div>

  <script>
    const ADMIN_PASSWORD = '32901123';
    const supabaseUrl = 'https://jhvniiyolcxavyjlewfh.supabase.co';
    const supabaseKey = 'sb_publishable_ajdFyMp1gqAwWD0R6SAwFA_f1yA3FBj';

    const client = supabase.createClient(supabaseUrl, supabaseKey);

    function checkPassword() {

  const input =
    document.getElementById('passwordInput').value;

  if (input === ADMIN_PASSWORD) {

    document.getElementById('loginScreen').style.display =
      'none';

    document.getElementById('adminContent').style.display =
      'block';

    loadQuestions();

  } else {

    document.getElementById('loginMessage').innerText =
      '비밀번호가 올바르지 않습니다.';
  }
}
    
    async function createQuestion() {
      const questionText = document.getElementById('questionText').value.trim();

      if (!questionText) {
        alert('질문을 입력하세요.');
        return;
      }

      const { error } = await client
        .from('questions')
        .insert([
          {
            question_text: questionText,
            is_active: false
          }
        ]);

      if (error) {
        alert('질문 추가 오류');
        console.error(error);
      } else {
        document.getElementById('questionText').value = '';
        loadQuestions();
      }
    }

    async function loadQuestions() {
      const { data, error } = await client
        .from('questions')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      const container = document.getElementById('questions');
      container.innerHTML = '';

      data.forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card' + (q.is_active ? ' active' : '');

        card.innerHTML = `
          <div class="question-text">${q.question_text}</div>
          <div class="status">${q.is_active ? '현재 ON' : 'OFF'}</div>

          <button class="primary" onclick="activateQuestion(${q.id})">
            이 질문 ON
          </button>

          <button class="warning" onclick="deleteQuestionResponses(${q.id})">
            이 질문 응답 삭제
          </button>

          <button class="danger" onclick="deleteQuestion(${q.id})">
            질문 삭제
          </button>
        `;

        container.appendChild(card);
      });
    }

    async function activateQuestion(questionId) {
      await client
        .from('questions')
        .update({ is_active: false })
        .neq('id', questionId);

      const { error } = await client
        .from('questions')
        .update({ is_active: true })
        .eq('id', questionId);

      if (error) {
        alert('ON 설정 오류');
        console.error(error);
      } else {
        loadQuestions();
      }
    }

    async function deleteActiveQuestionResponses() {
      const ok = confirm('현재 ON 되어 있는 질문의 응답을 모두 삭제할까요?');

      if (!ok) return;

      const { data: activeQuestion, error: questionError } = await client
        .from('questions')
        .select('*')
        .eq('is_active', true)
        .single();

      if (questionError || !activeQuestion) {
        alert('현재 ON 질문을 찾을 수 없습니다.');
        return;
      }

      const { error } = await client
        .from('responses')
        .delete()
        .eq('question_id', activeQuestion.id);

      if (error) {
        alert('응답 삭제 중 오류가 발생했습니다.');
        console.error(error);
      } else {
        alert('현재 ON 질문의 응답을 모두 삭제했습니다.');
      }
    }

    async function deleteQuestionResponses(questionId) {
      const ok = confirm('이 질문에 달린 응답만 모두 삭제할까요?');

      if (!ok) return;

      const { error } = await client
        .from('responses')
        .delete()
        .eq('question_id', questionId);

      if (error) {
        alert('응답 삭제 중 오류가 발생했습니다.');
        console.error(error);
      } else {
        alert('이 질문의 응답을 모두 삭제했습니다.');
      }
    }

    async function deleteQuestion(questionId) {
      const ok = confirm('이 질문을 삭제할까요? 연결된 응답도 함께 삭제됩니다.');

      if (!ok) return;

      await client
        .from('responses')
        .delete()
        .eq('question_id', questionId);

      const { error } = await client
        .from('questions')
        .delete()
        .eq('id', questionId);

      if (error) {
        alert('질문 삭제 중 오류가 발생했습니다.');
        console.error(error);
      } else {
        alert('질문을 삭제했습니다.');
        loadQuestions();
      }
    }

   
  </script>
</body>
</html>
